apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-project-2
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-project-2
  template:
    metadata:
      labels:
        app: devops-project-2
    spec:
      containers:
        - name: nginx-app
          image: 162591926474.dkr.ecr.ap-south-1.amazonaws.com/devops-project-2:1.0
          ports:
            - containerPort: 80
          imagePullPolicy: Always
